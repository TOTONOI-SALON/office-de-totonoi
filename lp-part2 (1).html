<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オフィスdeととのい - お問い合わせ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans JP',sans-serif;background:#f8f4ee;color:#1a1a18;line-height:1.7;}

/* CTA FINAL */
.cta-final{background:#ede8df;padding:80px 5%;text-align:center;}
.container{max-width:1100px;margin:0 auto;}
.sec-eyebrow{font-size:11px;letter-spacing:0.2em;color:#2d6a4f;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px;justify-content:center;}
.sec-eyebrow::before{content:'';display:inline-block;width:20px;height:1px;background:#2d6a4f;}
.cta-title{font-family:'Noto Serif JP',serif;font-size:clamp(20px,2.4vw,30px);color:#1a3d2b;margin-bottom:14px;line-height:1.6;}
.cta-sub{font-size:15px;color:#4a4a42;margin-bottom:28px;line-height:1.9;}
.checks{display:flex;flex-direction:column;align-items:center;gap:7px;margin-bottom:32px;}
.check{font-size:14px;color:#4a4a42;display:flex;align-items:center;gap:8px;}
.check::before{content:'✓';color:#2d6a4f;font-weight:700;font-size:15px;}
.cta-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.btn-primary{background:#1a3d2b;color:#fff;border:none;padding:15px 30px;font-size:15px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;border-radius:4px;letter-spacing:0.07em;}
.btn-secondary{background:transparent;color:#2d6a4f;border:1.5px solid #2d6a4f;padding:11px 22px;font-size:14px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;border-radius:4px;letter-spacing:0.04em;}

/* CONTACT FORM */
.form-section{background:#ede8df;padding:80px 5%;}
.form-box{background:#fff;border:1px solid #d8d0c8;border-radius:8px;padding:40px;max-width:640px;}
.form-title{font-family:'Noto Serif JP',serif;font-size:clamp(22px,2.4vw,30px);color:#1a3d2b;margin-bottom:14px;line-height:1.6;}
.form-sub{font-size:15px;color:#4a4a42;margin-bottom:36px;line-height:1.9;}
.field{margin-bottom:20px;}
.field label{display:block;font-size:13px;font-weight:700;color:#1a3d2b;margin-bottom:6px;}
.req{color:#c0392b;font-size:11px;margin-left:4px;}
.opt{color:#7a7a70;font-size:11px;font-weight:400;margin-left:4px;}
.field input,.field select,.field textarea{
  display:block;width:100%;padding:11px 14px;
  border:1.5px solid #d8d0c8;border-radius:4px;
  font-size:14px;font-family:'Noto Sans JP',sans-serif;
  color:#1a1a18;background:#f8f4ee;box-sizing:border-box;
}
.field textarea{resize:vertical;line-height:1.7;}
.form-note{font-size:12px;color:#7a7a70;line-height:1.8;margin-bottom:20px;}
.submit-btn{
  display:block;width:100%;padding:16px;
  background:#1a3d2b;color:#fff;border:none;border-radius:4px;
  font-size:16px;font-family:'Noto Sans JP',sans-serif;
  letter-spacing:0.08em;cursor:pointer;
}
.submit-btn:hover{background:#2d6a4f;}
.submit-btn:disabled{background:#2d6a4f;cursor:default;}

/* FOOTER */
footer{background:#1a3d2b;color:rgba(255,255,255,0.65);padding:44px 5%;text-align:center;}
.footer-logo{font-family:'Noto Serif JP',serif;color:#fff;font-size:17px;margin-bottom:10px;letter-spacing:0.06em;}
.footer-info{font-size:13px;line-height:2;margin-bottom:10px;}
.footer-copy{font-size:11px;opacity:0.4;margin-top:18px;}
</style>
</head>
<body>

<!-- CTA -->
<section class="cta-final">
  <div class="container">
    <div class="sec-eyebrow">まずは無料体験から</div>
    <h2 class="cta-title">職場に届く、本格ケア。<br>まず1回、体感してください。</h2>
    <p class="cta-sub">初期費用・解約手数料0円。月1回からスタートできます。</p>
    <div class="checks">
      <div class="check">初回無料体験あり</div>
      <div class="check">持ち運びベッド持参・スペース不要</div>
      <div class="check">松戸市・千葉県・東京都東部 対応</div>
    </div>
    <div class="cta-btns">
      <button class="btn-primary" onclick="document.getElementById('contact').scrollIntoView({behavior:'smooth'})">無料体験を申し込む →</button>
      <button class="btn-secondary" onclick="document.getElementById('contact').scrollIntoView({behavior:'smooth'})">メールで問い合わせ</button>
    </div>
  </div>
</section>

<!-- CONTACT FORM -->
<section class="form-section" id="contact">
  <div class="container">
    <div class="sec-eyebrow">Contact</div>
    <h2 class="form-title">無料体験・<br>お問い合わせ</h2>
    <p class="form-sub">無料体験のご予約・料金のご質問・対応エリアの確認など、どんな内容でもお気軽にどうぞ。通常2営業日以内にご返信いたします。</p>

    <div class="form-box">
      <div class="field">
        <label>会社名<span class="req">必須</span></label>
        <input type="text" placeholder="株式会社〇〇">
      </div>
      <div class="field">
        <label>お名前<span class="req">必須</span></label>
        <input type="text" placeholder="山田 太郎">
      </div>
      <div class="field">
        <label>メールアドレス<span class="req">必須</span></label>
        <input type="email" placeholder="example@company.co.jp">
      </div>
      <div class="field">
        <label>電話番号<span class="opt">任意</span></label>
        <input type="tel" placeholder="090-0000-0000">
      </div>
      <div class="field">
        <label>お問い合わせの種類<span class="req">必須</span></label>
        <select>
          <option value="">選択してください</option>
          <option>無料体験の予約</option>
          <option>料金・プランの確認</option>
          <option>対応エリアの確認</option>
          <option>福利厚生導入の相談</option>
          <option>その他</option>
        </select>
      </div>
      <div class="field">
        <label>社員数<span class="opt">任意</span></label>
        <select>
          <option value="">おおよそ何名ですか？</option>
          <option>〜10名</option>
          <option>11〜30名</option>
          <option>31〜50名</option>
          <option>51〜100名</option>
          <option>100名以上</option>
        </select>
      </div>
      <div class="field">
        <label>お問い合わせ内容<span class="opt">任意</span></label>
        <textarea rows="5" placeholder="ご質問・ご要望・ご希望の日時などをご自由にお書きください。"></textarea>
      </div>
      <p class="form-note">送信いただいた内容はお問い合わせへの返答のみに利用します。プライバシーポリシーに同意の上、送信してください。</p>
      <button class="submit-btn" onclick="this.textContent='送信しました ✓';this.disabled=true;">送信する →</button>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <div class="footer-logo">ととのいsalon.MATSUDO</div>
</footer>

</body>
</html>
